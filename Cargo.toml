[package]
name = "peridot"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[[bin]]
name = "abstract_watershed"
path = "src/bin/abstract_watershed.rs"

[[bin]]
name = "wbt_abstract_watershed"
path = "src/bin/wbt_abstract_watershed.rs"

[[bin]]
name = "sub_fields_abstraction"
path = "src/bin/sub_fields_abstraction.rs"

[[bin]]
name = "trace_downslope_flowpath"
path = "src/bin/trace_downslope_flowpath.rs"

[dependencies]
gdal = {version = "0.16", features = ["bindgen"] }
gdal-sys = { version = "0.9.1", optional = true }
maplit = "1.0"
interp = "1.0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.107"
geojson = "0.24.1"
error-stack = "0.4.1"
env_logger = "0.10.0"
lazy_static = "1.4.0"
once_cell = "1.18.0"
rayon = "1.8.0"
proj = "0.27.2"
clap = { version = "4.4.5", features = ["derive", "cargo"] }
csv = "1.2.2"
log = "0.4.20"
parquet = "53"
arrow-array = "53"
arrow-schema = "53"

[build-dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[features]
bindgen = ["gdal-sys/bindgen"]
